name: APK derle (arac karti yamasi)

# Elle calistirilir: Actions > "APK derle (arac karti yamasi)" > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Yamayi uygula
        run: |
          PATCH=stradaos-ritmo.patch
          test -f "$PATCH" || { echo "$PATCH deponun ana dizininde yok"; exit 1; }
          echo "Kullanilan yama: $PATCH"
          git apply --ignore-whitespace --verbose "$PATCH"

      - name: Ceviri satirlarini ekle (Turkce ve Ingilizce)
        run: |
          TAB=$(printf '\t')
          add() {
            f="app/src/main/assets/i18n/$1.txt"
            if ! grep -qxF -- "$2$TAB$3" "$f"; then
              if [ -n "$(tail -c1 "$f")" ]; then echo >> "$f"; fi
              printf '%s\t%s\n' "$2" "$3" >> "$f"
            fi
          }
          add tr 'Panel central' 'Orta panel'
          add tr 'Mapa, o una escena de carretera animada con tu auto rojo. Con la escena no hay navegación integrada' 'Harita veya kırmızı aracınızla animasyonlu bir otoyol sahnesi. Sahnede dahili navigasyon kullanılamaz'
          add tr 'Escena de carretera' 'Otoyol sahnesi'
          add tr 'Cambia el panel central a «Mapa» en Ajustes' 'Ayarlar bölümünden orta paneli «Harita» yapın'
          add tr 'Una tarjeta de música grande con barras que bailan y los botones aparte, el carro grande con la calzada que corre según la velocidad, y debajo los mantenimientos y el clima por horas. Android Auto y el cambio claro / oscuro están a los lados de la barra de apps.' 'Büyük bir müzik kartı: dans eden ses çubukları ve ayrı tuşlar; büyük araç ve hıza göre akan yol çizgileri; altında bakım kartı ve saatlik hava durumu. Android Auto ve açık/koyu tema düğmesi uygulama çubuğunun iki yanında.'
          add tr 'Este reproductor no deja adelantar ni atrasar desde aquí' 'Bu oynatıcı buradan ileri veya geri sarmaya izin vermiyor'
          add en 'Panel central' 'Center panel'
          add en 'Mapa, o una escena de carretera animada con tu auto rojo. Con la escena no hay navegación integrada' 'Map, or an animated highway scene with your red car. The scene has no built-in navigation'
          add en 'Escena de carretera' 'Highway scene'
          add en 'Cambia el panel central a «Mapa» en Ajustes' 'Set the center panel to “Map” in Settings'
          add en 'Una tarjeta de música grande con barras que bailan y los botones aparte, el carro grande con la calzada que corre según la velocidad, y debajo los mantenimientos y el clima por horas. Android Auto y el cambio claro / oscuro están a los lados de la barra de apps.' 'A big music card with dancing bars and separate buttons, a big car with the road scrolling with your speed, and maintenance and hourly weather below. Android Auto and a light/dark switch sit on either side of the app bar.'
          add en 'Este reproductor no deja adelantar ni atrasar desde aquí' 'This player does not allow seeking from here'

      - name: Debug APK derle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Release olarak yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK: $APK"
          cp "$APK" StradaOS-arac-karti.apk
          gh release delete arac-karti --yes --cleanup-tag || true
          gh release create arac-karti StradaOS-arac-karti.apk \
            --title "StradaOS Prueba (arac karti)" \
            --notes "StradaOS 2.39.0 + tema Ritmo (Ayarlar > Kisisellestirme > Tema): buyuk muzik karti, surukle-sar cizgisi, ses cubuklari, Android Auto ve tema dugmeleri, hiza gore akan yol, 20-180 olcekli hiz gostergesi." \
            --target "${{ github.sha }}"
